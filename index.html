<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>プラハ・フレーズ手帳 | チェコ語フレーズカード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --enamel-blue:#163A5F;
    --enamel-blue-dark:#0E2740;
    --cream:#F3EFE4;
    --cream-dim:#E9E3D2;
    --tram-red:#B0272D;
    --tram-red-dark:#8A1E23;
    --ink:#201D1A;
    --gold:#A9822F;
    --slate:#5C6570;
    --line:#D8D0BC;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--enamel-blue);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.04), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(255,255,255,0.03), transparent 40%);
    min-height:100vh;
    font-family:'Noto Sans JP', sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 14px;
  }
  .app{
    width:100%;
    max-width:460px;
  }
  .header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:0 6px 16px;
    color:var(--cream);
  }
  .header .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:#B9C6D6;
  }
  .header .title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:20px;
    margin-top:2px;
    color:var(--cream);
  }
  .header .counter{
    font-family:'IBM Plex Mono', monospace;
    font-size:15px;
    color:var(--cream);
    letter-spacing:0.02em;
  }

  .trackwrap{
    padding:0 6px 20px;
  }
  .track{
    position:relative;
    height:4px;
    background:rgba(255,255,255,0.15);
    border-radius:2px;
    overflow:hidden;
  }
  .track-fill{
    position:absolute;
    left:0;top:0;bottom:0;
    background:var(--tram-red);
    border-radius:2px;
    transition:width .25s ease;
  }
  .stops{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
  }
  .stop{
    width:6px;height:6px;border-radius:50%;
    background:rgba(255,255,255,0.25);
    cursor:pointer;
    flex-shrink:0;
  }
  .stop.active{ background:var(--tram-red); transform:scale(1.5); }
  .stop.done{ background:var(--gold); }

  .card-stage{
    position:relative;
    touch-action:pan-y;
  }
  .card{
    background:var(--cream);
    border-radius:18px;
    padding:30px 26px 26px;
    position:relative;
    box-shadow:0 18px 40px rgba(0,0,0,0.28), 0 2px 0 rgba(0,0,0,0.06);
    min-height:420px;
    display:flex;
    flex-direction:column;
  }
  .bolt{
    position:absolute;
    width:9px;height:9px;
    border-radius:50%;
    background:var(--gold);
    box-shadow:inset 0 1px 2px rgba(0,0,0,0.4), 0 1px 0 rgba(255,255,255,0.3);
  }
  .bolt.tl{top:12px;left:12px;}
  .bolt.tr{top:12px;right:12px;}
  .bolt.bl{bottom:12px;left:12px;}
  .bolt.br{bottom:12px;right:12px;}

  .jp-meaning{
    font-size:15px;
    font-weight:700;
    color:var(--slate);
    line-height:1.5;
    margin:0 0 14px;
  }
  .cz-phrase{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:30px;
    line-height:1.25;
    color:var(--enamel-blue);
    margin:0 0 10px;
  }
  .kana{
    font-family:'Noto Sans JP', sans-serif;
    font-size:14px;
    letter-spacing:0.03em;
    color:var(--tram-red-dark);
    margin:0 0 18px;
  }
  .speak-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
  }
  .speak-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:var(--enamel-blue);
    color:var(--cream);
    border:none;
    border-radius:999px;
    padding:9px 18px;
    font-family:'Noto Sans JP', sans-serif;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    transition:transform .1s ease, background .15s ease;
  }
  .speak-btn:active{ transform:scale(0.96); }
  .speak-btn.playing{ background:var(--tram-red); }
  .speak-btn svg{ width:14px;height:14px;flex-shrink:0; }
  .speak-btn.small{
    padding:6px 12px;
    font-size:11px;
    background:transparent;
    border:1px solid var(--slate);
    color:var(--slate);
  }
  .speak-btn.small.playing{
    background:var(--tram-red-dark);
    border-color:var(--tram-red-dark);
    color:var(--cream);
  }

  .divider{
    border:none;
    border-top:1px dashed var(--line);
    margin:4px 0 16px;
  }
  .ex-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 10px;
  }
  .example{
    margin-bottom:16px;
  }
  .example:last-child{ margin-bottom:0; }
  .example .ex-jp{
    font-size:12.5px;
    color:var(--slate);
    margin:0 0 4px;
  }
  .example .ex-cz{
    font-family:'Fraunces', serif;
    font-size:16px;
    font-weight:500;
    color:var(--ink);
    margin:0 0 3px;
  }
  .example .ex-kana{
    font-size:12px;
    color:var(--tram-red-dark);
    opacity:0.85;
    margin:0 0 6px;
  }

  .nav-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:18px;
    padding:0 4px;
  }
  .nav-btn{
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.25);
    color:var(--cream);
    width:46px;height:46px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .nav-btn:active{ transform:scale(0.92); }
  .nav-btn:disabled{ opacity:0.3; cursor:default; }
  .nav-btn svg{ width:20px;height:20px; }
  .hint{
    font-size:11px;
    color:#B9C6D6;
    text-align:center;
  }
  .voice-note{
    margin-top:14px;
    text-align:center;
    font-size:11px;
    color:#B9C6D6;
  }

  @media (max-width:380px){
    .cz-phrase{ font-size:25px; }
    .card{ padding:24px 20px 22px; min-height:auto; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <div class="eyebrow">Pražská fráze &mdash; プラハ・フレーズ手帳</div>
      <div class="title">今日のひとこと</div>
    </div>
    <div class="counter" id="counter">01 / 30</div>
  </div>

  <div class="trackwrap">
    <div class="track"><div class="track-fill" id="trackFill"></div></div>
    <div class="stops" id="stops"></div>
  </div>

  <div class="card-stage" id="cardStage">
    <div class="card" id="card">
      <div class="bolt tl"></div><div class="bolt tr"></div><div class="bolt bl"></div><div class="bolt br"></div>
      <p class="jp-meaning" id="jpMeaning"></p>
      <p class="cz-phrase" id="czPhrase"></p>
      <p class="kana" id="kana"></p>
      <div class="speak-row">
        <button class="speak-btn" id="mainSpeak">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16.5 12c0-1.77-1-3.29-2.5-4.03v8.05c1.5-.73 2.5-2.25 2.5-4.02z" opacity="0.85"/></svg>
          発音を聞く
        </button>
      </div>
      <hr class="divider">
      <div class="ex-label">Příklady &mdash; 例文</div>
      <div id="examples"></div>
    </div>
  </div>

  <div class="nav-row">
    <button class="nav-btn" id="prevBtn" aria-label="前のフレーズ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="hint">スワイプ、または矢印キーでも切り替えられます</div>
    <button class="nav-btn" id="nextBtn" aria-label="次のフレーズ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>
  <div class="voice-note" id="voiceNote"></div>
</div>

{jp:"おすすめの料理はなんですか？", cz:"Co mi doporučíte?", kana:"ツォ ミ ドポルチーテ？",
 ex:[{jp:"どんな料理をおすすめしますか？", cz:"Jaké jídlo mi doporučíte?", kana:"ヤケー イードロ ミ ドポルチーテ？"},
     {jp:"こちらのおすすめ料理はなんですか？", cz:"Jaké je vaše specialita?", kana:"ヤケー イエ ヴァシェ スペツィアリタ？"}]},
{jp:"これをください", cz:"Dám si toto.", kana:"ダーム シ トト",
 ex:[{jp:"ビールを1つください。", cz:"Dám si jedno pivo, prosím.", kana:"ダーム シ イエドノ ピヴォ、プロシーム"},
     {jp:"このケーキをください。", cz:"Tento koláč, prosím.", kana:"テント コラーチ、プロシーム"}]},
{jp:"お会計をお願いします", cz:"Zaplatím, prosím.", kana:"ザプラチーム、プロシーム",
 ex:[{jp:"お会計をお願いできますか？", cz:"Můžeme zaplatit?", kana:"ムージェメ ザプラチチ？"},
     {jp:"勘定書をお願いします。", cz:"Účet, prosím.", kana:"ウーチェト、プロシーム"}]},
{jp:"〇〇していただけますか？", cz:"Mohl/a byste...?", kana:"モフル / モフラ ビステ…？",
 ex:[{jp:"手伝っていただけますか？", cz:"Mohl byste mi pomoci?", kana:"モフル ビステ ミ ポモツィ？"},
     {jp:"タクシーを呼んでいただけますか？", cz:"Mohla byste zavolat taxi?", kana:"モフラ ビステ ザヴォラト タクシー？"}]}
];

let idx = 0;
const total = data.length;
let czechVoice = null;

const counterEl = document.getElementById('counter');
const trackFill = document.getElementById('trackFill');
const stopsEl = document.getElementById('stops');
const jpMeaning = document.getElementById('jpMeaning');
const czPhrase = document.getElementById('czPhrase');
const kanaEl = document.getElementById('kana');
const examplesEl = document.getElementById('examples');
const mainSpeak = document.getElementById('mainSpeak');
const cardStage = document.getElementById('cardStage');
const voiceNote = document.getElementById('voiceNote');

for (let i = 0; i < total; i++){
  const dot = document.createElement('div');
  dot.className = 'stop';
  dot.dataset.i = i;
  dot.addEventListener('click', () => { idx = i; render(); });
  stopsEl.appendChild(dot);
}

function cleanForSpeech(s){
  s = s.replace(/\[[^\]]*\]/g,'').trim();
  if (s.includes(' / ')) s = s.split(' / ')[0].trim();
  s = s.replace(/\/a\b/g,'');
  s = s.replace(/\s{2,}/g,' ');
  s = s.replace(/\s+([?.,;])/g,'$1');
  return s;
}

function pickVoice(){
  if (!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  return voices.find(v => v.lang && v.lang.toLowerCase().startsWith('cs')) || null;
}

function speak(text, btn){
  if (!('speechSynthesis' in window)){
    voiceNote.textContent = 'このブラウザは音声読み上げに対応していません。';
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(cleanForSpeech(text));
  utter.lang = 'cs-CZ';
  utter.rate = 0.85;
  if (czechVoice) utter.voice = czechVoice;
  if (btn){
    utter.onstart = () => btn.classList.add('playing');
    utter.onend = () => btn.classList.remove('playing');
    utter.onerror = () => btn.classList.remove('playing');
  }
  window.speechSynthesis.speak(utter);
  if (!czechVoice){
    voiceNote.textContent = 'チェコ語音声が見つからないため、端末の標準音声で再生しています。';
  } else {
    voiceNote.textContent = '';
  }
}

function render(){
  const item = data[idx];
  counterEl.textContent = String(idx+1).padStart(2,'0') + ' / ' + total;
  trackFill.style.width = ((idx+1)/total*100) + '%';
  jpMeaning.textContent = item.jp;
  czPhrase.textContent = item.cz;
  kanaEl.textContent = item.kana;

  examplesEl.innerHTML = '';
  item.ex.forEach((ex, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'example';
    wrap.innerHTML =
      '<p class="ex-jp">' + ex.jp + '</p>' +
      '<p class="ex-cz">' + ex.cz + '</p>' +
      '<p class="ex-kana">' + ex.kana + '</p>' +
      '<button class="speak-btn small" data-ex="' + i + '">' +
        '<svg viewBox="0 0 24 24" fill="currentColor" style="width:11px;height:11px;"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16.5 12c0-1.77-1-3.29-2.5-4.03v8.05c1.5-.73 2.5-2.25 2.5-4.02z" opacity="0.85"/></svg>' +
        ' 例文を聞く' +
      '</button>';
    const b = wrap.querySelector('button');
    b.addEventListener('click', () => speak(ex.cz, b));
    examplesEl.appendChild(wrap);
  });

  document.querySelectorAll('.stop').forEach((d, i) => {
    d.classList.toggle('active', i === idx);
    d.classList.toggle('done', i < idx);
  });

  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === total-1;
  voiceNote.textContent = '';
}

mainSpeak.addEventListener('click', () => speak(data[idx].cz, mainSpeak));
document.getElementById('prevBtn').addEventListener('click', () => { if (idx>0){ idx--; render(); } });
document.getElementById('nextBtn').addEventListener('click', () => { if (idx<total-1){ idx++; render(); } });

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' && idx < total-1){ idx++; render(); }
  if (e.key === 'ArrowLeft' && idx > 0){ idx--; render(); }
});

let touchStartX = null;
cardStage.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; });
cardStage.addEventListener('touchend', (e) => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50){
    if (dx < 0 && idx < total-1){ idx++; render(); }
    if (dx > 0 && idx > 0){ idx--; render(); }
  }
  touchStartX = null;
});

if ('speechSynthesis' in window){
  czechVoice = pickVoice();
  window.speechSynthesis.onvoiceschanged = () => { czechVoice = pickVoice(); };
}

render();
</script>
</body>
</html>
